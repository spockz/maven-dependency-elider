# WHY: Runs the repository's complete documented check on pull requests and pushes.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Java 21 and Go 1.24.4 / make check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Go 1.24.4
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.4'
          cache: false

      - name: Install documentation linter
        run: make tools

      - name: Run full project check
        run: make check
